services:
  db:
    image: postgres:15
    container_name: comverse_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: comverse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - "9090:8080"
